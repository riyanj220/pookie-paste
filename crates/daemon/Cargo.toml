[package]
name = "daemon"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "pookie-paste"
path = "src/main.rs"

[dev-dependencies]
serde_json = "1"

[dependencies]

tokio = { version = "1", features = ["full"] }

tracing = "0.1"

tracing-subscriber = {
    version = "0.3",
    features = ["env-filter"]
}

anyhow = "1"

pookie-clipboard = {
    path = "../pookie-clipboard"
}

pookie-core = {
    path = "../pookie-core"
}

chrono = "0.4"

storage = {
    path = "../storage"
}

history = {
    path = "../history"
}

ipc = {
    path = "../ipc"
}

uuid = {
    version = "1",
    features = ["v4"]
}

x11rb = {
    version = "0.13",
    features = ["xtest"],
}

zbus = "5.19"

futures-util = "0.3"

ashpd = {
    version = "0.13.13",
    default-features = false,
    features = [
        "tokio",
        "remote_desktop",
        "screencast"
    ]
}

reis = {
    version = "0.7.1",
    features = ["tokio"]
}

rustix = {
    version = "1",
    features = ["time"]
}
