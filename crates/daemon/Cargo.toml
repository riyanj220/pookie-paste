[package]
name = "daemon"
version = "0.1.0"
edition = "2024"

[dependencies]

tokio = { version = "1", features = ["full"] }

tracing = "0.1"

tracing-subscriber = {
    version = "0.3",
    features = ["env-filter"]
}

anyhow = "1"

pookie-clipboard = {
    path = "../pookie-clipboard"
}

pookie-core = {
    path = "../pookie-core"
}

chrono = "0.4"

storage = {
    path = "../storage"
}

history = {
    path = "../history"
}

ipc = {
    path = "../ipc"
}

uuid = { version = "1", features = ["v4"] }

x11rb = {
    version = "0.13",
    features = ["xtest"],
}