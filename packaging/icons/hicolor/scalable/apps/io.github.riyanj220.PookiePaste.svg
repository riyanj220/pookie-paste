<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#090a0f" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Clipboard Board Base -->
  <rect x="36" y="32" width="184" height="204" rx="28" fill="#1e2029" filter="url(#shadow)"/>
  <rect x="36" y="32" width="184" height="204" rx="28" fill="none" stroke="#2e3242" stroke-width="2"/>

  <!-- Back History Layer Card -->
  <rect x="58" y="74" width="140" height="142" rx="14" fill="#475569" opacity="0.6"/>

  <!-- Front History Main Card -->
  <rect x="64" y="66" width="128" height="146" rx="14" fill="#f8fafc"/>

  <!-- Content Lines on Main Card (Representing clipboard history text) -->
  <!-- Top active item (Violet accent) -->
  <rect x="80" y="98" width="60" height="10" rx="5" fill="#8b5cf6"/>
  <rect x="146" y="98" width="30" height="10" rx="5" fill="#c4b5fd"/>

  <!-- Second item -->
  <rect x="80" y="122" width="96" height="8" rx="4" fill="#94a3b8"/>
  <!-- Third item -->
  <rect x="80" y="142" width="76" height="8" rx="4" fill="#cbd5e1"/>
  <!-- Fourth item -->
  <rect x="80" y="162" width="88" height="8" rx="4" fill="#cbd5e1"/>
  <!-- Fifth item -->
  <rect x="80" y="182" width="52" height="8" rx="4" fill="#e2e8f0"/>

  <!-- Top Clip Base -->
  <rect x="88" y="20" width="80" height="32" rx="10" fill="#334155"/>
  <rect x="90" y="22" width="76" height="28" rx="8" fill="#64748b"/>
  <!-- Clip Inner Window / Grip -->
  <rect x="108" y="30" width="40" height="12" rx="6" fill="#1e2029"/>
</svg>
